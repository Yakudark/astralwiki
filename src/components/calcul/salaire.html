<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paies Automatique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --matrix-black: #000000;
            --matrix-card: #060f06;
            --matrix-border: #0d2b0d;
            --matrix-green: #00ff41;
            --matrix-mid: #00c030;
            --matrix-dim: #006618;
            --matrix-dimmer: #003a0d;
            --matrix-white: #e8ffe8;
            --font-mono: 'Share Tech Mono', monospace;
            --font-ui: 'Rajdhani', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--matrix-black);
            color: var(--matrix-green);
            font-family: var(--font-mono);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.18;
            pointer-events: none;
        }

        header,
        .container {
            position: relative;
            z-index: 1;
        }

        header {
            background: transparent;
            border-bottom: 1px solid var(--matrix-dim);
            padding: 2rem 1rem;
            text-align: center;
        }

        header .eyebrow {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: var(--matrix-dim);
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        header h1 {
            font-family: var(--font-ui);
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--matrix-green);
            text-shadow: 0 0 20px var(--matrix-green), 0 0 40px var(--matrix-mid);
            margin: 0;
            text-transform: uppercase;
        }

        header .subline {
            font-size: 0.72rem;
            color: var(--matrix-dim);
            letter-spacing: 0.2em;
            margin-top: 0.5rem;
        }

        .card {
            background-color: var(--matrix-card) !important;
            border: 1px solid var(--matrix-border) !important;
            border-radius: 2px !important;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.06), inset 0 0 60px rgba(0, 0, 0, 0.4) !important;
        }

        .card-body {
            padding: 2rem;
        }

        .form-label {
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: var(--matrix-dim);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            display: block;
        }

        textarea.form-control {
            background-color: #020902 !important;
            border: 1px solid var(--matrix-dimmer) !important;
            border-radius: 2px !important;
            color: var(--matrix-mid) !important;
            font-family: var(--font-mono) !important;
            font-size: 0.82rem;
            resize: vertical;
            min-height: 200px;
            caret-color: var(--matrix-green);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea.form-control::placeholder {
            color: var(--matrix-dimmer) !important;
        }

        textarea.form-control:focus {
            outline: none !important;
            border-color: var(--matrix-dim) !important;
            box-shadow: 0 0 0 2px rgba(0, 255, 65, 0.08), 0 0 12px rgba(0, 255, 65, 0.1) !important;
            background-color: #030d03 !important;
        }

        .file-import-row {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .file-import-row label.btn-file {
            background: transparent;
            border: 1px dashed var(--matrix-dimmer);
            color: var(--matrix-dim);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            padding: 0.45rem 1rem;
            border-radius: 2px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .file-import-row label.btn-file:hover {
            border-color: var(--matrix-mid);
            color: var(--matrix-mid);
        }

        #fileInput {
            display: none;
        }

        #fileStatus {
            font-size: 0.7rem;
            color: var(--matrix-dim);
            letter-spacing: 0.1em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #lineCount {
            font-size: 0.65rem;
            color: var(--matrix-dimmer);
            letter-spacing: 0.1em;
            text-align: right;
            margin-top: 3px;
            margin-bottom: 0.6rem;
        }

        .btn-matrix {
            width: 100%;
            background: transparent;
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            padding: 0.75rem;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, color 0.2s;
        }

        .btn-matrix:hover {
            background: rgba(0, 255, 65, 0.08);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            color: var(--matrix-white);
        }

        .btn-matrix:active {
            background: rgba(0, 255, 65, 0.18);
        }

        hr {
            border-color: var(--matrix-border) !important;
            opacity: 1 !important;
            margin: 1.8rem 0;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 0.82rem;
        }

        .matrix-table thead tr {
            border-bottom: 1px solid var(--matrix-dim);
        }

        .matrix-table thead th {
            color: var(--matrix-dim);
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            padding: 0.6rem 0.8rem;
            font-weight: normal;
        }

        .matrix-table tbody tr {
            border-bottom: 1px solid var(--matrix-border);
            transition: background 0.15s;
        }

        .matrix-table tbody tr:hover {
            background: rgba(0, 255, 65, 0.04);
        }

        .matrix-table tbody td {
            padding: 0.75rem 0.8rem;
            color: var(--matrix-mid);
            vertical-align: middle;
        }

        .td-name {
            color: var(--matrix-white);
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        .td-salary {
            color: var(--matrix-green);
            text-align: right;
            font-size: 0.9rem;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.4);
        }

        .td-center {
            text-align: center;
        }

        .date-period {
            color: var(--matrix-dim);
            font-size: 0.72rem;
            line-height: 1.6;
        }

        .date-arrow {
            color: var(--matrix-dimmer);
            display: block;
            line-height: 1;
        }

        .matrix-table tfoot tr {
            border-top: 1px solid var(--matrix-mid);
        }

        .matrix-table tfoot td {
            padding: 0.75rem 0.8rem;
            color: var(--matrix-green);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .total-amount {
            text-align: right;
            font-size: 1rem;
            text-shadow: 0 0 12px rgba(0, 255, 65, 0.6);
        }

        .matrix-error {
            color: #ff4444;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-align: center;
            padding: 1rem;
            border: 1px solid #440000;
            background: #0d0000;
            border-radius: 2px;
        }

        .matrix-info {
            color: var(--matrix-dim);
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-align: center;
            padding: 0.6rem;
            border: 1px solid var(--matrix-border);
            background: #020902;
            border-radius: 2px;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <canvas id="matrix-canvas"></canvas>
    <header>
        <p class="eyebrow">// SYSTÈME DE GESTION //</p>
        <h1>Paies Automatique</h1>
        <p class="subline">WAKE UP, NEO &mdash; LES SALAIRES ONT BESOIN DE TOI</p>
    </header>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-9">
                <div class="card">
                    <div class="card-body">
                        <div class="file-import-row">
                            <label class="btn-file" for="fileInput">&gt; Importer un fichier .txt_</label>
                            <input type="file" id="fileInput" accept=".txt,.log,text/plain">
                            <span id="fileStatus">ou coller directement dans la zone ci-dessous</span>
                        </div>
                        <div class="mb-1">
                            <label for="employeeData" class="form-label">// Données des employés</label>
                            <textarea id="employeeData" class="form-control" rows="10"
                                placeholder="Collez les embeds Discord ici..."></textarea>
                        </div>
                        <div id="lineCount">0 lignes</div>
                        <button type="button" class="btn-matrix" onclick="calculateSum()">
                            &gt; Calculer la somme_
                        </button>
                        <hr>
                        <div id="result" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        /* ---- Pluie Matrix ---- */
        (function () {
            var cv = document.getElementById('matrix-canvas'), ctx = cv.getContext('2d');
            var ch = 'アイウエオカキクケコサシスセソABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&';
            var cols, drops, FS = 14;
            function init() { cv.width = window.innerWidth; cv.height = window.innerHeight; cols = Math.floor(cv.width / FS); drops = Array(cols).fill(1); }
            function draw() {
                ctx.fillStyle = 'rgba(0,0,0,0.045)'; ctx.fillRect(0, 0, cv.width, cv.height);
                ctx.font = FS + 'px Share Tech Mono,monospace';
                drops.forEach(function (y, i) {
                    var c = ch[Math.floor(Math.random() * ch.length)];
                    ctx.fillStyle = Math.random() > 0.93 ? '#e8ffe8' : '#00c030';
                    ctx.fillText(c, i * FS, y * FS);
                    if (y * FS > cv.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                });
            }
            init(); setInterval(draw, 45); window.addEventListener('resize', init);
        })();

        /* ---- Import fichier ---- */
        document.getElementById('fileInput').addEventListener('change', function () {
            var file = this.files[0]; if (!file) return;
            var r = new FileReader();
            r.onload = function (e) {
                document.getElementById('employeeData').value = e.target.result;
                updateCount();
                document.getElementById('fileStatus').textContent = '✓ ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' Ko)';
            };
            r.readAsText(file, 'UTF-8');
        });
        var ta = document.getElementById('employeeData');
        function updateCount() {
            document.getElementById('lineCount').textContent =
                ta.value.split('\n').length.toLocaleString('fr-FR') + ' lignes · ' +
                ta.value.length.toLocaleString('fr-FR') + ' caractères';
        }
        ta.addEventListener('input', updateCount);

        /* ================================================================
           PARSER — Format embed paies YouTool/ESX
        
           Format observé (Discord colle les champs sur des lignes séparées,
           certaines lignes ont des emojis ou espaces invisibles en tête) :
        
           Gestion d'entreprise
           🪙 Salaire versé - YouTool
           Employé          ID          Grade
           Jaron Kelly      2           Gérant
           Salaire versé    Solde société   Statut
           $100             $14216          En service
           ESX | Paycheck Société | 2026-07-24 13:05:17   ← FIN de livraison
        
           Particularités :
           - Les lignes "Employé  ID  Grade" et "Salaire versé  Solde société  Statut"
             sont des en-têtes de tableau Discord sur UNE SEULE LIGNE avec des espaces/tabs
           - Le nom de l'employé et le salaire sont sur la ligne suivante, aussi tabulée
           - "ESX | Paycheck Société | DATE" est le seul séparateur fiable
        ================================================================ */

        function clean(raw) {
            return raw
                .replace(/[\u{1F000}-\u{1FFFF}]/gu, '')
                .replace(/[\u{2600}-\u{27BF}]/gu, '')
                .replace(/[\u{FE00}-\u{FEFF}]/gu, '')
                .replace(/^[\s\u00a0\u200b\u202f\u205f\u3000\u2000-\u200a]+/, '')
                .replace(/[\s\u00a0\u200b\u202f\u205f\u3000\u2000-\u200a]+$/, '')
                .trim();
        }

        function parseEmbeds(raw) {
            var employees = {};
            var lines = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');

            var IDLE = 0;
            var WANT_NAME_ROW = 1;  // prochaine ligne contient "Nom  ID  Grade" collés
            var WANT_SAL_ROW = 2;  // prochaine ligne contient "$montant  $solde  statut"

            var state = IDLE;
            var currentEmployee = null;
            var pendingSalary = 0;
            var pendingDate = null;
            var hasData = false;

            function commitBlock() {
                if (!currentEmployee || !hasData) return;
                var key = currentEmployee.toLowerCase();
                if (!employees[key]) {
                    employees[key] = {
                        name: currentEmployee,
                        paies: 0, total: 0,
                        firstDate: pendingDate, lastDate: pendingDate,
                    };
                }
                var emp = employees[key];
                emp.paies++;
                emp.total += pendingSalary;
                if (pendingDate) emp.lastDate = pendingDate;
            }

            function resetCycle() {
                pendingSalary = 0;
                pendingDate = null;
                hasData = false;
                state = IDLE;
                // currentEmployee persiste jusqu'au prochain label "Employé..."
            }

            lines.forEach(function (rawLine) {
                var line = clean(rawLine);
                if (line === '') return;

                // ── SÉPARATEUR : ligne ESX | Paycheck Société | DATE ─────────────
                var dateMatch = line.match(/ESX\s*\|\s*Paycheck\s+Soci[eé]t[eé]\s*\|\s*(.+)/i);
                if (dateMatch) {
                    pendingDate = dateMatch[1].trim();
                    commitBlock();
                    resetCycle();
                    return;
                }

                // ── LIGNES À IGNORER ──────────────────────────────────────────────
                if (/^Gestion d.entreprise$/i.test(line)) return;
                if (/^Salaire vers[eé]\s*[-–]\s*/i.test(line)) return; // "Salaire versé - YouTool"
                if (/^Paycheck Logs/i.test(line)) return;

                // ── DÉTECTION DE L'EN-TÊTE DE TABLEAU DISCORD ────────────────────
                // Discord affiche les champs d'un embed sur UNE ligne avec séparateurs
                // "Employé   ID   Grade"  → déclenche lecture du nom à la ligne suivante
                // "Salaire versé   Solde société   Statut" → déclenche lecture du salaire
                if (/^Employ[eé]/i.test(line) && /\bID\b/i.test(line)) {
                    state = WANT_NAME_ROW;
                    return;
                }
                if (/^Salaire vers[eé]/i.test(line) && /Solde/i.test(line)) {
                    state = WANT_SAL_ROW;
                    return;
                }
                // Label seul "Employé" (format alternatif sans tableau)
                if (/^Employ[eé]$/i.test(line)) {
                    state = WANT_NAME_ROW;
                    return;
                }
                // Label seul "Salaire versé" (format alternatif)
                if (/^Salaire vers[eé]$/i.test(line)) {
                    state = WANT_SAL_ROW;
                    return;
                }

                // ── MACHINE À ÉTATS ───────────────────────────────────────────────
                switch (state) {

                    case WANT_NAME_ROW:
                        // La ligne contient : "Jaron Kelly   2   Gérant"
                        // On prend tout ce qui précède le premier bloc de chiffres/espaces
                        // correspondant à l'ID (généralement un petit entier)
                        var namePart = line
                            // Retire ID + Grade : tout ce qui suit un nombre isolé
                            .replace(/\s+\d+\s+\S.*$/, '')
                            // Retire aussi le char ID inline si présent
                            .replace(/`[^`]*`/g, '')
                            .replace(/char\d*:[a-f0-9]+/gi, '')
                            .trim();
                        if (namePart) currentEmployee = namePart;
                        state = IDLE;
                        break;

                    case WANT_SAL_ROW:
                        // La ligne contient : "$100   $14216   En service"
                        // On cherche le PREMIER montant ($xxx)
                        var salMatch = line.match(/\$\s*([\d,\.]+)/);
                        if (salMatch) {
                            pendingSalary = parseFloat(salMatch[1].replace(',', '.'));
                            hasData = true;
                        }
                        state = IDLE;
                        break;

                    case IDLE:
                    default:
                        break;
                }
            });

            // Commit du dernier bloc si le texte ne se termine pas par une ligne ESX
            if (currentEmployee && hasData) commitBlock();

            return Object.values(employees).sort(function (a, b) { return a.name.localeCompare(b.name); });
        }

        /* ---- Affichage ---- */
        function calculateSum() {
            var raw = document.getElementById('employeeData').value;
            var resultDiv = document.getElementById('result');

            if (!raw.trim()) {
                resultDiv.innerHTML = '<div class="matrix-error">// ERREUR : zone de texte vide</div>';
                return;
            }

            var employees = parseEmbeds(raw);

            if (!employees.length) {
                resultDiv.innerHTML = '<div class="matrix-error">// ERREUR : aucun employé détecté — vérifiez le format des données</div>';
                return;
            }

            var totalSum = 0, rows = '';

            employees.forEach(function (emp) {
                totalSum += emp.total;
                var first = emp.firstDate || '—';
                var last = emp.lastDate || '—';
                var period = (first === last)
                    ? '<span class="date-period">' + first + '</span>'
                    : '<span class="date-period">' + first + '<span class="date-arrow">↓</span>' + last + '</span>';
                rows +=
                    '<tr>' +
                    '<td class="td-name">' + emp.name + '</td>' +
                    '<td class="td-center">' + emp.paies + '</td>' +
                    '<td class="td-center">' + period + '</td>' +
                    '<td class="td-salary">$' + emp.total.toFixed(2) + '</td>' +
                    '</tr>';
            });

            resultDiv.innerHTML =
                '<div class="matrix-info">// ' + employees.length + ' employé(s) · ' +
                employees.reduce(function (s, e) { return s + e.paies; }, 0) + ' paie(s) analysée(s)</div>' +
                '<table class="matrix-table">' +
                '<thead><tr>' +
                '<th>Employé</th>' +
                '<th style="text-align:center">Paies</th>' +
                '<th style="text-align:center">Période salariale</th>' +
                '<th style="text-align:right">Total</th>' +
                '</tr></thead>' +
                '<tbody>' + rows + '</tbody>' +
                '<tfoot><tr>' +
                '<td colspan="3">// Total général</td>' +
                '<td class="total-amount">$' + totalSum.toFixed(2) + '</td>' +
                '</tr></tfoot>' +
                '</table>';
        }
    </script>
</body>

</html>
